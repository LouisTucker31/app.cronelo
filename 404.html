<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Page not found · Workspace</title>
<!-- The host shows this page for any address that isn't a file, at any depth, so relative
     links would break: it links to the app's files by full path. Each is listed twice, for
     GitHub Pages (under /app.workspace/) and for a host at the site root (Cloudflare); the
     browser ignores whichever isn't there. Once the app is only on Cloudflare, drop the
     /app.workspace/ lines. -->
<link rel="icon" href="/app.workspace/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.workspace/css/fonts.css">
<link rel="stylesheet" href="/app.workspace/css/styles.css">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/styles.css">
<script src="/app.workspace/js/early.js"></script>
<script src="/js/early.js"></script>
<style>
/* The sign-in card (.gate-card), with a link styled as the app's primary button. */
.gate-card { text-align: center; align-items: center; }
.gate-card h1 { margin: 6px 0 0; }
.gate-code { margin: 0; font: 600 11px 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .06em; color: var(--text-13); }
.gate-card .gate-sub { max-width: 280px; }
.gate-card a.primary { align-self: stretch; height: 36px; margin-top: 4px; justify-content: center; font-size: 12.5px; text-decoration: none; }
.gate-card a.primary,
.gate-card a.primary:hover { color: var(--on-strong); }
</style>
</head>
<body>
<main class="gate">
<div class="gate-card">
<div class="gate-brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32" width="22" height="22"><path d="M6.5 9.5l4.2 13 5.3-10.2 5.3 10.2 4.2-13" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span>Workspace</span></div>
<p class="gate-code">404</p>
<h1>Page not found</h1>
<p class="gate-sub">There’s nothing at this address. The link may be mistyped or out of date.</p>
<a class="primary" href="/" data-home>Go to your projects</a>
</div>
</main>
<script src="/app.workspace/js/not-found.js"></script>
<script src="/js/not-found.js"></script>
</body>
</html>
