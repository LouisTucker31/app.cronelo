<!DOCTYPE html>

<!-- Shown by the host for any address that isn't a file. It is self-contained (no links to
     css/ or js/), because it can be shown at any depth, where relative links would break.
     The one inline script is allowed by its hash: change the script, update the hash. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-E0AuR7+QJPaOFIPUcPuNSD1EluUsedqYv38JCTDwGqk='; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">

<title>Page not found</title>
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --edge: #dde2e8;
  --text: #121417;
  --muted: #5a6169;
  --accent: #418dab;
  --accent-text: #ffffff;
  --focus-glow: rgba(71, 144, 173, .25);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417;
    --surface: #1b1f24;
    --edge: #2a2e33;
    --text: #e6e9ed;
    --muted: #9aa1a9;
    --accent-text: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417;
  --surface: #1b1f24;
  --edge: #2a2e33;
  --text: #e6e9ed;
  --muted: #9aa1a9;
  --accent-text: #ffffff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main {
  width: 100%;
  max-width: 420px;
  padding: 32px 28px;
  background: var(--surface);
  border: 1px solid var(--edge);
  border-radius: 12px;
  text-align: center;
}
svg { width: 40px; height: 40px; color: var(--accent); }
.code {
  margin: 12px 0 0;
  font: 600 12px/1 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  letter-spacing: .08em;
  color: var(--muted);
}
h1 { margin: 8px 0 8px; font-size: 20px; line-height: 1.3; font-weight: 650; }
p { margin: 0 0 24px; color: var(--muted); }
a {
  display: inline-block;
  padding: 9px 16px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
  text-decoration: none;
}
a:hover { filter: brightness(1.08); }
a:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-glow); }
</style>
</head>
<body>
<main>
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle><path d="M8 11h6"></path></svg>
<p class="code">404</p>
<h1>There’s nothing at this address</h1>
<p>The link may be mistyped or out of date. Your projects are in Workspace.</p>
<a href="/" data-home>Go to Workspace</a>
</main>
<script>(function () { var saved; try { saved = localStorage.getItem('theme'); } catch (e) {} if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved); var seg = location.pathname.split('/')[1]; if (/\.github\.io$/.test(location.hostname) && seg) document.querySelector('[data-home]').setAttribute('href', '/' + seg + '/'); })();</script>
</body>
</html>
